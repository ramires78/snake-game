<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Snake</title>
<style>
  body {
    margin: 0;
    background: #101020;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
  }
  h1 { color: #36ffae; }
  canvas {
    background: #181830;
    border: 3px solid #36ffae;
    max-width: 90vw;
  }
  button {
    margin: 16px;
    padding: 12px 24px;
    background: #36ffae;
    border: 0;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
  }
</style>
</head>
<body>
<h1>NEON SNAKE v1.0</h1>
<p>Счёт: <span id="score">0</span></p>
<canvas id="game" width="400" height="400"></canvas>
<button onclick="start()">Начать заново</button>
<p>Управление: стрелки клавиатуры</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const cell = 20;
const count = 20;
let snake, food, dx, dy, nextDx, nextDy, score, timer;

function spawnFood() {
  const empty = [];
  for (let x = 0; x < count; x++) {
    for (let y = 0; y < count; y++) {
      if (!snake.some(p => p.x === x && p.y === y)) {
        empty.push({x, y});
      }
    }
  }
  return empty.length ? empty[Math.floor(Math.random() * empty.length)] : null;
}

function start() {
  clearInterval(timer);
  snake = [{x: 10, y: 10}];
  dx = 1; dy = 0;
  nextDx = 1; nextDy = 0;
  score = 0;
  document.getElementById("score").textContent = score;
  food = spawnFood();
  draw();
  timer = setInterval(tick, 130);
}

function draw() {
  ctx.clearRect(0, 0, 400, 400);
  ctx.fillStyle = "#36ffae";
  snake.forEach(p => ctx.fillRect(p.x * cell + 1, p.y * cell + 1, 18, 18));
  if (food) {
    ctx.fillStyle = "#ff477e";
    ctx.fillRect(food.x * cell + 2, food.y * cell + 2, 16, 16);
  }
}

function tick() {
  dx = nextDx; dy = nextDy;
  const head = {x: snake[0].x + dx, y: snake[0].y + dy};
  const eating = food && head.x === food.x && head.y === food.y;
  const body = eating ? snake : snake.slice(0, -1);

  if (head.x < 0 || head.y < 0 || head.x >= count ||
      head.y >= count || body.some(p => p.x === head.x && p.y === head.y)) {
    clearInterval(timer);
    alert("Игра окончена! Счёт: " + score);
    return;
  }

  snake.unshift(head);
  if (eating) {
    score++;
    document.getElementById("score").textContent = score;
    food = spawnFood();
    if (!food) {
      clearInterval(timer);
      alert("Победа! Всё поле заполнено!");
    }
  } else {
    snake.pop();
  }
  draw();
}

document.addEventListener("keydown", e => {
  const keys = ["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"];
  if (keys.includes(e.key)) e.preventDefault();

  if (e.key === "ArrowUp" && dy !== 1) {
    nextDx = 0; nextDy = -1;
  } else if (e.key === "ArrowDown" && dy !== -1) {
    nextDx = 0; nextDy = 1;
  } else if (e.key === "ArrowLeft" && dx !== 1) {
    nextDx = -1; nextDy = 0;
  } else if (e.key === "ArrowRight" && dx !== -1) {
    nextDx = 1; nextDy = 0;
  }
});

start();
</script>
</body>
</html>
